[project]
name = "origin-spectrum-organizer"
version = "0.1.0"
description = "Windows application for organizing HORIBA FluoroMax-4 spectra in Origin."
requires-python = ">=3.14"
dependencies = [
    "PySide6",
    "pywin32>=312",
    "originpro==1.1.15",
]

[project.scripts]
spectrum-organizer = "spectrum_organizer.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]
