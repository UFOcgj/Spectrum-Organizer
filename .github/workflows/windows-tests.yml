name: Windows automated tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  unittest:
    name: Python 3.14 / portable core
    runs-on: windows-latest
    timeout-minutes: 20
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONUTF8: "1"
      QT_QPA_PLATFORM: offscreen

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Reject non-noreply commit email metadata
        shell: pwsh
        run: |
          $emails = @(
            git log --all --format='%ae%n%ce' |
              Where-Object { $_ } |
              ForEach-Object { $_.Trim().ToLowerInvariant() } |
              Sort-Object -Unique
          )

          $badCount = @(
            $emails | Where-Object {
              $_ -notmatch '^(?:[^@\s]+@users\.noreply\.github\.com|noreply@github\.com)$'
            }
          ).Count

          if ($badCount -gt 0) {
            throw "Public refs contain $badCount non-noreply commit email address(es)."
          }

      - name: Set up Python 3.14
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install project
        run: python -m pip install -e .

      - name: Run automated tests
        run: >-
          python -B -m unittest
          tests.test_attribution
          tests.test_data_columns
          tests.test_dry_run_pipeline
          tests.test_fingerprints_and_copies
          tests.test_import_boundaries
          tests.test_name_policy
          tests.test_normalization
          tests.test_note_parser
          tests.test_output_model
          tests.test_output_pipeline
          tests.test_report
          tests.test_run_snapshot
          tests.test_sample_library
          tests.test_selection
          tests.test_settings
          tests.test_special_groups
          tests.test_state_machine
          tests.test_task17_packaging
          tests.test_validity
