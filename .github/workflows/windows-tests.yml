name: Windows automated tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  unittest:
    name: Python 3.14 / no Origin / shard ${{ matrix.shard }}
    runs-on: windows-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3]
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      QT_QPA_PLATFORM: offscreen
      SHARD_COUNT: "4"
      SHARD_INDEX: ${{ matrix.shard }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python 3.14
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install project
        run: python -m pip install -e .

      - name: Run automated tests
        shell: pwsh
        run: |
          $modules = @(Get-ChildItem tests\test_*.py | Sort-Object Name | ForEach-Object { "tests.$($_.BaseName)" })
          $selected = @()
          for ($index = [int]$env:SHARD_INDEX; $index -lt $modules.Count; $index += [int]$env:SHARD_COUNT) {
            $selected += $modules[$index]
          }
          if ($selected.Count -eq 0) {
            throw "Test shard $env:SHARD_INDEX is empty."
          }
          Write-Host "Running $($selected.Count) of $($modules.Count) test modules in shard $env:SHARD_INDEX."
          python -B -m unittest $selected
